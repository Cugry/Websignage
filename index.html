<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signage Board</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(18, 24, 33, .82);
      --panel-strong: rgba(23, 31, 43, .94);
      --line: rgba(255, 255, 255, .12);
      --text: #f4f7fb;
      --muted: #9ca8b8;
      --accent: #4fd1c5;
      --accent-2: #f7b955;
      --danger: #ff6b6b;
      --shadow: 0 24px 80px rgba(0, 0, 0, .38);
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(120deg, rgba(79, 209, 197, .16), transparent 34%),
        linear-gradient(310deg, rgba(247, 185, 85, .12), transparent 40%),
        radial-gradient(circle at 50% 120%, rgba(255, 255, 255, .12), transparent 34%),
        #0d1117;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(16px, 2.4vw, 34px);
      height: 100vh;
      padding: clamp(18px, 3vw, 42px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 18px;
      min-height: 120px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .08);
      box-shadow: inset 0 1px 18px rgba(255, 255, 255, .07);
      flex: 0 0 auto;
    }

    .mark svg {
      width: 34px;
      height: 34px;
    }

    .clock {
      text-align: center;
      white-space: nowrap;
      justify-self: center;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(58px, 8.4vw, 132px);
      font-weight: 850;
      line-height: .9;
    }

    .date {
      color: var(--muted);
      font-size: clamp(21px, 2vw, 34px);
      font-weight: 700;
      line-height: 1.2;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) clamp(130px, 16vh, 180px);
      gap: clamp(16px, 2vw, 28px);
      min-height: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      min-width: 0;
      min-height: 0;
    }

    .weather {
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 10px;
      padding: clamp(18px, 2.4vw, 30px);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 56ch;
    }

    .weather-now {
      display: grid;
      align-content: center;
      gap: 18px;
      padding-block: 16px;
    }

    .weather-visual {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: clamp(14px, 2vw, 26px);
    }

    .weather-icon {
      display: grid;
      place-items: center;
      width: clamp(92px, 13vw, 160px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .03)),
        rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
    }

    .weather-icon svg {
      width: 68%;
      height: 68%;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .25));
    }

    .temp {
      font-variant-numeric: tabular-nums;
      font-size: clamp(56px, 10vw, 126px);
      font-weight: 850;
      line-height: .88;
    }

    .temp-line {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .weather-alerts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 520px;
    }

    .alert-pill {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .08);
      color: var(--muted);
      font-size: clamp(24px, 2vw, 34px);
      font-weight: 800;
      white-space: nowrap;
      line-height: 1;
    }

    .alert-pill.warn {
      background: rgba(247, 185, 85, .2);
      border-color: rgba(247, 185, 85, .48);
      color: #ffe4a7;
    }

    .alert-pill.alarm {
      background: rgba(255, 107, 107, .22);
      border-color: rgba(255, 107, 107, .55);
      color: #ffd0d0;
    }

    .alert-pill.special {
      background: rgba(255, 255, 255, .92);
      border-color: rgba(255, 255, 255, .95);
      color: #111722;
    }

    .condition {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(17px, 1.8vw, 25px);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .astro-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .metric {
      display: grid;
      align-content: space-between;
      gap: 12px;
      min-width: 0;
      min-height: 86px;
      padding: 13px 14px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
    }

    .astro-grid .metric {
      min-height: 82px;
      padding: 12px 12px 13px;
      text-align: left;
      justify-items: stretch;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: clamp(15px, 1.15vw, 19px);
      font-weight: 700;
      line-height: 1.1;
      justify-self: start;
    }

    .metric strong {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(30px, 3vw, 48px);
      line-height: 1;
    }

    .astro-grid .metric strong {
      font-size: clamp(24px, 2.2vw, 36px);
      white-space: nowrap;
      text-align: center;
    }

    .moon-phase {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .moon-phase svg {
      width: clamp(34px, 3.2vw, 48px);
      height: clamp(34px, 3.2vw, 48px);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .28));
      flex: 0 0 auto;
    }

    .moon-phase strong {
      margin-top: 0;
      font-size: clamp(24px, 2.2vw, 36px);
      line-height: 1.15;
      white-space: normal;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .day {
      display: grid;
      gap: 10px;
      align-content: space-between;
      min-height: 104px;
      padding: 10px 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      min-width: 0;
    }

    .day-name {
      justify-self: start;
      color: var(--muted);
      font-size: clamp(15px, 1.15vw, 19px);
      font-weight: 800;
    }

    .day-body {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
    }

    .day-body svg {
      width: clamp(38px, 3.5vw, 56px);
      height: clamp(38px, 3.5vw, 56px);
    }

    .day-temp {
      font-size: clamp(20px, 1.8vw, 30px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .news {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(14px, 1.5vw, 20px);
      overflow: hidden;
    }

    .ticker-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      margin-top: 10px;
    }

    .items {
      --news-gap: 12px;
      display: flex;
      align-items: stretch;
      will-change: transform;
    }

    .news-sequence {
      display: flex;
      gap: var(--news-gap);
      align-items: stretch;
      flex: 0 0 auto;
    }

    .news-sequence + .news-sequence {
      margin-left: var(--news-gap);
    }

    .news-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
      width: clamp(430px, 42vw, 760px);
      min-height: 0;
      height: 100%;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
    }

    .bullet {
      width: 10px;
      height: 10px;
      margin-top: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(247, 185, 85, .12);
    }

    .headline {
      margin: 0;
      font-size: clamp(16px, 1.7vw, 24px);
      line-height: 1.28;
      font-weight: 800;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: end;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
      min-height: 40px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .07);
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, .13);
    }

    body.remote-navigation button:focus,
    body.remote-navigation input:focus,
    body.remote-navigation textarea:focus,
    body.remote-navigation select:focus {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(79, 209, 197, .2);
    }

    body.remote-navigation input:focus,
    body.remote-navigation textarea:focus,
    body.remote-navigation select:focus {
      background: rgba(255, 255, 255, .14);
      border-color: var(--accent);
    }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(420px, 100vw);
      padding: 22px;
      background: var(--panel-strong);
      border-left: 1px solid var(--line);
      box-shadow: -24px 0 80px rgba(0, 0, 0, .35);
      transform: translateX(100%);
      transition: transform .22s ease;
      z-index: 5;
      overflow: auto;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .drawer h2 {
      margin: 0;
      font-size: 24px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      outline: 0;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .location-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 10px;
    }

    .location-search {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .09);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 800;
      white-space: nowrap;
    }

    .location-search:disabled {
      opacity: .55;
    }

    .form-message {
      min-height: 18px;
      margin-top: -7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .form-message.success {
      color: var(--accent);
    }

    .form-message.error {
      color: var(--danger);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .primary, .secondary {
      min-height: 44px;
      border-radius: 8px;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: #072220;
    }

    .secondary {
      background: rgba(255, 255, 255, .09);
      border: 1px solid var(--line);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100vh;
      }
      .main, .footer {
        grid-template-columns: 1fr;
      }
      .clock {
        text-align: center;
      }
      .main {
        min-height: auto;
      }
      .weather, .news {
        min-height: 520px;
      }
    }

    @media (min-width: 901px) and (max-height: 1100px) {
      .app {
        gap: clamp(12px, 1.5vh, 20px);
        padding: clamp(18px, 2.4vh, 28px) clamp(28px, 3vw, 56px);
      }

      .topbar {
        min-height: 86px;
        align-items: center;
        grid-template-columns: 1fr auto 1fr;
      }

      .mark {
        width: 52px;
        height: 52px;
      }

      .mark svg {
        width: 32px;
        height: 32px;
      }

      .time {
        font-size: clamp(72px, 7vw, 112px);
      }

      .date {
        font-size: clamp(20px, 1.8vw, 28px);
      }

      .main {
        gap: clamp(14px, 1.5vw, 24px);
        grid-template-rows: minmax(0, 1fr) clamp(118px, 15vh, 150px);
      }

      .weather, .news {
        padding: clamp(16px, 1.8vw, 24px);
      }

      .news {
        padding: 12px 16px;
      }

      .ticker-wrap {
        margin-top: 8px;
      }

      .news-item {
        width: clamp(390px, 40vw, 650px);
        padding: 10px 12px;
      }

      .headline {
        font-size: clamp(15px, 1.5vw, 21px);
      }

      .meta {
        margin-top: 6px;
        font-size: 12px;
      }

      .weather {
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        gap: 8px;
        overflow: hidden;
      }

      .weather-now {
        gap: 12px;
        padding-block: 4px;
        align-content: center;
      }

      .weather-icon {
        width: clamp(96px, 9vw, 132px);
      }

      .temp {
        font-size: clamp(64px, 7vw, 104px);
      }

      .weather-alerts {
        max-width: 430px;
        gap: 8px;
      }

      .alert-pill {
        min-height: 40px;
        padding: 7px 12px;
        font-size: clamp(20px, 1.65vw, 28px);
      }

      .condition {
        margin-top: 6px;
        font-size: clamp(16px, 1.4vw, 22px);
      }

      .metric-grid {
        gap: 8px;
      }

      .metric {
        min-height: 74px;
        padding: 10px 12px 11px;
        gap: 9px;
      }

      .metric span {
        font-size: clamp(14px, 1.05vw, 17px);
      }

      .metric strong {
        font-size: clamp(27px, 2.4vw, 40px);
      }

      .forecast {
        gap: 7px;
      }

      .day {
        gap: 7px;
        min-height: 88px;
        padding: 8px 8px 9px;
      }

      .day-body svg {
        width: clamp(32px, 3vw, 44px);
        height: clamp(32px, 3vw, 44px);
      }

      .day-name {
        font-size: clamp(13px, 1vw, 16px);
      }

      .day-temp {
        font-size: clamp(17px, 1.5vw, 24px);
      }

      .astro-grid {
        gap: 7px;
      }

      .astro-grid .metric {
        min-height: 74px;
        padding: 9px 9px 10px;
      }

      .astro-grid .metric strong {
        font-size: clamp(21px, 1.8vw, 30px);
      }

      .moon-phase {
        gap: 6px;
      }

      .moon-phase svg {
        width: clamp(30px, 2.5vw, 40px);
        height: clamp(30px, 2.5vw, 40px);
      }

      .moon-phase strong {
        font-size: clamp(21px, 1.8vw, 30px);
      }

      .footer {
        min-height: 32px;
      }
    }

    @media (min-width: 901px) and (max-height: 700px) {
      .app {
        gap: 10px;
        padding: 14px 28px;
      }

      .topbar {
        min-height: 68px;
        grid-template-columns: 1fr auto 1fr;
      }

      .mark {
        width: 46px;
        height: 46px;
      }

      .mark svg {
        width: 28px;
        height: 28px;
      }

      .time {
        font-size: clamp(62px, 7.2vw, 92px);
      }

      .date {
        font-size: 18px;
      }

      .weather, .news {
        padding: 14px;
      }

      .main {
        grid-template-rows: minmax(0, 1fr) 112px;
      }

      .news {
        padding: 10px 12px;
      }

      .ticker-wrap {
        margin-top: 6px;
      }

      .news-item {
        width: clamp(340px, 42vw, 560px);
        padding: 8px 10px;
      }

      .headline {
        font-size: clamp(14px, 1.55vw, 19px);
      }

      .meta {
        margin-top: 4px;
        font-size: 11px;
      }

      .section-label {
        font-size: 12px;
      }

      .weather {
        gap: 6px;
      }

      .weather-now {
        gap: 10px;
        padding-block: 2px;
      }

      .weather-icon {
        width: clamp(82px, 10vw, 110px);
      }

      .temp {
        font-size: clamp(52px, 8vw, 86px);
      }

      .temp-line {
        gap: 10px;
      }

      .weather-alerts {
        max-width: 340px;
        gap: 7px;
      }

      .alert-pill {
        min-height: 34px;
        padding: 6px 10px;
        font-size: clamp(17px, 2vw, 24px);
      }

      .condition {
        margin-top: 4px;
        font-size: 16px;
      }

      .metric {
        min-height: 62px;
        padding: 7px 8px 8px;
        gap: 6px;
      }

      .metric span {
        font-size: 12px;
      }

      .metric strong {
        font-size: clamp(21px, 2.7vw, 32px);
      }

      .day {
        gap: 4px;
        min-height: 72px;
        padding: 6px 6px 7px;
      }

      .day-name {
        font-size: 12px;
      }

      .day-temp {
        font-size: clamp(15px, 2vw, 21px);
      }

      .day-body svg {
        width: 28px;
        height: 28px;
      }

      .astro-grid .metric {
        min-height: 62px;
        padding: 6px 6px 7px;
      }

      .astro-grid .metric strong {
        font-size: clamp(18px, 2.2vw, 26px);
      }

      .moon-phase {
        gap: 5px;
      }

      .moon-phase svg {
        width: 26px;
        height: 26px;
      }

      .moon-phase strong {
        font-size: clamp(18px, 2.2vw, 26px);
      }

      .footer {
        min-height: 28px;
      }
    }

    @media (max-width: 560px) {
      .weather-visual, .metric-grid, .astro-grid, .forecast, .row, .action-row {
        grid-template-columns: 1fr;
      }
      .news-item {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M10 41h44" stroke="#4fd1c5" stroke-width="5" stroke-linecap="round"/>
            <path d="M18 32c0-8 6-14 14-14s14 6 14 14" stroke="#f7b955" stroke-width="5" stroke-linecap="round"/>
            <path d="M32 8v5M49 15l-4 4M15 15l4 4" stroke="#f7b955" stroke-width="4" stroke-linecap="round"/>
            <path d="M16 49h32" stroke="#f4f7fb" stroke-width="5" stroke-linecap="round" opacity=".72"/>
          </svg>
        </div>
        <div class="date" id="date">----</div>
      </div>
      <div class="clock" aria-live="polite">
        <div class="time" id="time">--:--</div>
      </div>
      <div aria-hidden="true"></div>
    </header>

    <section class="main">
      <section class="panel weather" aria-label="天気">
        <div class="section-label">
          <span id="weatherPlace">Tokyo</span>
          <span class="status" id="weatherStatus">読み込み中</span>
        </div>
        <div class="weather-now">
          <div class="weather-visual">

  <script>
    const DEFAULTS = {
      title: "サイネージボード",
      kicker: "Live Information",
      place: "Tokyo",
      municipality: "",
      latitude: 35.6812,
      longitude: 139.7671,
      warningOfficeCode: "130000",
      warningAreaCode: "130010",
      warningAreaName: "東京地方",
      warningMunicipality: "",
      weatherMinutes: 10,
      alertMinutes: 5,
      newsMinutes: 12,
      proxy: "auto",
      feeds: [
        "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja",
        "https://news.yahoo.co.jp/rss/topics/top-picks.xml",
        "https://www3.nhk.or.jp/rss/news/cat0.xml"
      ]
    };

    const WEATHER_CODES = {
      0: ["快晴", "sun"], 1: ["晴れ", "sun"], 2: ["一部くもり", "partly"], 3: ["くもり", "cloud"],
      45: ["霧", "fog"], 48: ["霧氷", "fog"], 51: ["小雨", "rain"], 53: ["霧雨", "rain"],
      55: ["強い霧雨", "rain"], 56: ["着氷性の霧雨", "rain"], 57: ["強い着氷性の霧雨", "rain"],
      61: ["弱い雨", "rain"], 63: ["雨", "rain"], 65: ["強い雨", "rain"],
      66: ["冷たい雨", "rain"], 67: ["強い冷たい雨", "rain"], 71: ["弱い雪", "snow"],
      73: ["雪", "snow"], 75: ["強い雪", "snow"], 77: ["雪粒", "snow"],
      80: ["にわか雨", "rain"], 81: ["にわか雨", "rain"], 82: ["強いにわか雨", "rain"],
      85: ["にわか雪", "snow"], 86: ["強いにわか雪", "snow"], 95: ["雷雨", "storm"],
      96: ["ひょうを伴う雷雨", "storm"], 99: ["強いひょうを伴う雷雨", "storm"]
    };

    const JMA_WARNING_NAMES = {
      "02": "暴風雪警報", "03": "大雨警報", "04": "洪水警報", "05": "暴風警報", "06": "大雪警報", "07": "波浪警報", "08": "高潮警報",
      "10": "大雨注意報", "12": "大雪注意報", "13": "風雪注意報", "14": "雷注意報", "15": "強風注意報", "16": "波浪注意報",
      "17": "融雪注意報", "18": "洪水注意報", "19": "高潮注意報", "20": "濃霧注意報", "21": "乾燥注意報", "22": "なだれ注意報",
      "23": "低温注意報", "24": "霜注意報", "25": "着氷注意報", "26": "着雪注意報",
      "29": "土砂災害注意報", "39": "土砂災害警報", "49": "土砂災害危険警報", "59": "土砂災害特別警報",
      "32": "暴風雪特別警報", "33": "大雨特別警報", "35": "暴風特別警報", "36": "大雪特別警報", "37": "波浪特別警報", "38": "高潮特別警報"
    };

    const JMA_LEVEL_HAZARDS = {
      VPWW55: "大雨",
      VPWW56: "土砂災害",
      VPWW57: "高潮"
    };

    const $ = (id) => document.getElementById(id);
    const state = {
      settings: loadSettings(),
      news: [],
      newsOffset: 0,
      jmaAreasPromise: null,
      timers: []
    };

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem("signage-settings") || "{}");
        return { ...DEFAULTS, ...saved, feeds: Array.isArray(saved.feeds) ? saved.feeds : DEFAULTS.feeds };
      } catch {
        return { ...DEFAULTS };
      }
    }

    function saveSettings(next) {
      state.settings = next;
      localStorage.setItem("signage-settings", JSON.stringify(next));
    }

    function weatherSvg(type) {
      const common = 'fill="none" stroke-linecap="round" stroke-linejoin="round"';
      const sun = '<circle cx="32" cy="32" r="11" fill="#f7b955"/><g stroke="#f7b955" stroke-width="4" stroke-linecap="round"><path d="M32 8v7M32 49v7M8 32h7M49 32h7M15 15l5 5M44 44l5 5M49 15l-5 5M20 44l-5 5"/></g>';
      const cloud = '<path d="M22 44h25a10 10 0 0 0 0-20 15 15 0 0 0-29-2A11 11 0 0 0 22 44Z" fill="#d7e3ef"/>';
      const rain = '<g stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"><path d="M23 50l-3 6M34 50l-3 6M45 50l-3 6"/></g>';
      const snow = '<g stroke="#d7e3ef" stroke-width="3" stroke-linecap="round"><path d="M25 51l-4 4M25 55l-4-4M38 51l-4 4M38 55l-4-4"/></g>';
      const bolt = '<path d="M33 43 26 58l13-13h-8l6-12" fill="#f7b955"/>';
      if (type === "sun") return `<svg viewBox="0 0 64 64">${sun}</svg>`;
      if (type === "partly") return `<svg viewBox="0 0 64 64"><g transform="translate(-8 -8) scale(.9)">${sun}</g>${cloud}</svg>`;
      if (type === "rain") return `<svg viewBox="0 0 64 64">${cloud}${rain}</svg>`;
      if (type === "snow") return `<svg viewBox="0 0 64 64">${cloud}${snow}</svg>`;
      if (type === "storm") return `<svg viewBox="0 0 64 64">${cloud}${bolt}</svg>`;
      if (type === "fog") return `<svg viewBox="0 0 64 64">${cloud}<g ${common} stroke="#9ca8b8" stroke-width="4"><path d="M14 51h36M20 58h30"/></g></svg>`;
      return `<svg viewBox="0 0 64 64">${cloud}</svg>`;
    }

    function applyChrome() {
      $("weatherPlace").textContent = state.settings.place;
      $("settingMunicipality").value = state.settings.municipality || "";
      $("settingMunicipality").dataset.resolved = normalizeLocationName(state.settings.municipality || "");
      setMunicipalityStatus("");
      $("settingPlace").value = state.settings.place;
      $("settingLat").value = state.settings.latitude;
      $("settingLon").value = state.settings.longitude;
      $("settingWarningOffice").value = state.settings.warningOfficeCode || DEFAULTS.warningOfficeCode;
      $("settingWarningArea").value = state.settings.warningAreaCode || DEFAULTS.warningAreaCode;
      $("settingWarningArea").dataset.municipality = normalizeLocationName(state.settings.warningMunicipality || "");
      $("settingWarningName").value = state.settings.warningAreaName || DEFAULTS.warningAreaName;
      $("settingWeatherMinutes").value = state.settings.weatherMinutes;
      $("settingAlertMinutes").value = state.settings.alertMinutes || DEFAULTS.alertMinutes;
      $("settingNewsMinutes").value = state.settings.newsMinutes;
      $("settingFeeds").value = state.settings.feeds.join("\n");
      $("settingProxy").value = ["auto", "allorigins", "rss2json", "jina", "direct"].includes(state.settings.proxy)
        ? state.settings.proxy
        : "auto";
    }

    function updateClock() {
      const now = new Date();
      $("time").textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).format(now);
      $("date").textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      }).format(now);
    }

    async function updateWeather() {
      const { latitude, longitude } = state.settings;
      $("weatherStatus").textContent = "更新中";
      try {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude, longitude,
          current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset",
          timezone: "auto",
          wind_speed_unit: "ms",
          forecast_days: "5"
        }).toString();
        const data = await fetch(url).then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        });
        const current = data.current;
        const [label, icon] = WEATHER_CODES[current.weather_code] || ["不明", "cloud"];
        $("temp").textContent = `${Math.round(current.temperature_2m)}°`;
        $("condition").textContent = label;
        $("humidity").textContent = `${Math.round(current.relative_humidity_2m)}%`;
        $("wind").textContent = `${Number(current.wind_speed_10m).toFixed(1)} m/s`;
        $("rain").textContent = `${data.daily.precipitation_probability_max[0] ?? "--"}%`;
        $("weatherIcon").innerHTML = weatherSvg(icon);
        const astro = getAstronomy(new Date(), Number(latitude), Number(longitude));
        $("sunrise").textContent = formatClock(data.daily.sunrise?.[0]);
        $("sunset").textContent = formatClock(data.daily.sunset?.[0]);
        $("moonrise").textContent = formatClock(astro.moonrise);
        $("moonset").textContent = formatClock(astro.moonset);
        renderMoonPhase(astro.moonAge);
        $("forecast").innerHTML = data.daily.time.map((date, index) => {
          const [dayLabel, dayIcon] = WEATHER_CODES[data.daily.weather_code[index]] || ["-", "cloud"];
          const weekday = new Intl.DateTimeFormat("ja-JP", { weekday: "short" }).format(new Date(`${date}T00:00:00`));
          const high = Math.round(data.daily.temperature_2m_max[index]);
          const low = Math.round(data.daily.temperature_2m_min[index]);
          return `<div class="day" title="${dayLabel}"><div class="day-name">${weekday}</div><div class="day-body">${weatherSvg(dayIcon)}<div class="day-temp">${low}° / ${high}°</div></div></div>`;
        }).join("");
        $("weatherStatus").textContent = `更新 ${new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit" }).format(new Date())}`;
      } catch (error) {
        $("weatherStatus").innerHTML = `<span class="error">天気を取得できません</span>`;
      }
    }

    function normalizeLocationName(value) {
      return String(value || "").replace(/[\s　]+/g, "").trim();
    }

    function setMunicipalityStatus(message, type = "") {
      const target = $("municipalityStatus");
      if (!target) return;
      target.textContent = message;
      target.className = `form-message${type ? ` ${type}` : ""}`;
    }

    async function findMunicipality(query) {
      const normalizedQuery = normalizeLocationName(query);
      if (!normalizedQuery) throw new Error("市区町村名を入力してください");
      if (!/[市区町村]$/.test(normalizedQuery)) {
        throw new Error("市区町村名まで入力してください");
      }

      const url = new URL("https://msearch.gsi.go.jp/address-search/AddressSearch");
      url.searchParams.set("q", normalizedQuery);
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const results = await response.json();
      const candidates = (Array.isArray(results) ? results : []).filter((item) => {
        const coordinates = item?.geometry?.coordinates;
        return Array.isArray(coordinates)
          && Number.isFinite(Number(coordinates[0]))
          && Number.isFinite(Number(coordinates[1]))
          && !item?.properties?.addressCode
          && /[市区町村]$/.test(normalizeLocationName(item?.properties?.title));
      });

      const exact = candidates.find((item) => normalizeLocationName(item.properties?.title) === normalizedQuery);
      const suffixMatches = candidates.filter((item) => normalizeLocationName(item.properties?.title).endsWith(normalizedQuery));
      if (!exact && suffixMatches.length > 1) {
        throw new Error("同名の地域があります。都道府県名から入力してください");
      }

      const selected = exact || suffixMatches[0] || candidates[0];
      if (!selected) throw new Error("市区町村が見つかりませんでした");
      const [longitude, latitude] = selected.geometry.coordinates.map(Number);
      return {
        municipality: selected.properties?.title || query.trim(),
        latitude,
        longitude
      };
    }

    async function loadJmaAreas() {
      if (!state.jmaAreasPromise) {
        state.jmaAreasPromise = fetch("https://www.jma.go.jp/bosai/common/const/area.json", { cache: "no-store" })
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          });
      }
      try {
        return await state.jmaAreasPromise;
      } catch (error) {
        state.jmaAreasPromise = null;
        throw error;
      }
    }

    function getJmaOfficeCode(areas, class20Code) {
      let code = String(class20Code || "");
      const visited = new Set();
      while (code && !visited.has(code)) {
        if (areas.offices?.[code]) return code;
        visited.add(code);
        const item = areas.class20s?.[code] || areas.class15s?.[code] || areas.class10s?.[code];
        code = item?.parent || "";
      }
      return "";
    }

    function municipalityPart(value) {
      return normalizeLocationName(value)
        .replace(/^(北海道|東京都|京都府|大阪府|.{2,3}県)/, "")
        .replace(/^.*郡/, "");
    }

    async function findJmaWarningArea(location) {
      const reverseUrl = new URL("https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress");
      reverseUrl.search = new URLSearchParams({
        lat: location.latitude,
        lon: location.longitude
      }).toString();
      const [areas, reverseResponse] = await Promise.all([
        loadJmaAreas(),
        fetch(reverseUrl, { cache: "no-store" })
      ]);
      if (!reverseResponse.ok) throw new Error(`HTTP ${reverseResponse.status}`);
      const reverseData = await reverseResponse.json();
      const municipalityCode = String(reverseData.results?.muniCd || "");
      if (!/^\d{5}$/.test(municipalityCode)) {
        throw new Error("警報区域を特定できませんでした");
      }

      const directCode = `${municipalityCode}00`;
      let selectedCodes = areas.class20s?.[directCode] ? [directCode] : [];
      if (!selectedCodes.length) {
        const locationName = municipalityPart(location.municipality);
        const candidates = Object.entries(areas.class20s || {})
          .filter(([code]) => code.startsWith(municipalityCode.slice(0, 2)))
          .map(([code, item]) => {
            const areaName = normalizeLocationName(item.name);
            let score = 0;
            if (locationName === areaName) score = 100;
            else if (locationName.startsWith(areaName)) score = 90;
            else if (areaName.startsWith(locationName)) score = 80;
            else if (locationName.endsWith(areaName)) score = 70;
            return { code, score };
          })
          .filter((candidate) => candidate.score > 0);
        const bestScore = Math.max(0, ...candidates.map((candidate) => candidate.score));
        selectedCodes = candidates
          .filter((candidate) => candidate.score === bestScore)
          .map((candidate) => candidate.code);
      }

      if (!selectedCodes.length) throw new Error("気象庁の警報区域が見つかりませんでした");
      const officeCode = getJmaOfficeCode(areas, selectedCodes[0]);
      if (!officeCode) throw new Error("気象庁の発表官署を特定できませんでした");
      return {
        officeCode,
        areaCodes: selectedCodes,
        areaName: location.municipality,
        municipality: normalizeLocationName(location.municipality)
      };
    }

    function applyWarningAreaToForm(warningArea) {
      $("settingWarningOffice").value = warningArea.officeCode;
      $("settingWarningArea").value = warningArea.areaCodes.join(",");
      $("settingWarningArea").dataset.municipality = warningArea.municipality;
      $("settingWarningName").value = warningArea.areaName;
    }

    async function resolveMunicipalityFromForm() {
      const input = $("settingMunicipality");
      const button = $("resolveMunicipality");
      const query = input.value.trim();
      button.disabled = true;
      setMunicipalityStatus("地点と警報区域を検索中");
      try {
        const location = await findMunicipality(query);
        const warningArea = await findJmaWarningArea(location);
        input.value = location.municipality;
        input.dataset.resolved = normalizeLocationName(location.municipality);
        $("settingPlace").value = location.municipality;
        $("settingLat").value = location.latitude.toFixed(6);
        $("settingLon").value = location.longitude.toFixed(6);
        applyWarningAreaToForm(warningArea);
        setMunicipalityStatus(`${location.municipality}と警報区域を設定しました`, "success");
        return location;
      } catch (error) {
        setMunicipalityStatus(error.message || "地点を検索できませんでした", "error");
        throw error;
      } finally {
        button.disabled = false;
      }
    }

    function warningAreaNeedsSync() {
      const municipality = normalizeLocationName(state.settings.municipality);
      const warningMunicipality = normalizeLocationName(state.settings.warningMunicipality);
      return Boolean(municipality && municipality !== warningMunicipality);
    }

    async function syncSavedWarningArea() {
      const warningArea = await findJmaWarningArea({
        municipality: state.settings.municipality,
        latitude: Number(state.settings.latitude),
        longitude: Number(state.settings.longitude)
      });
      saveSettings({
        ...state.settings,
        warningOfficeCode: warningArea.officeCode,
        warningAreaCode: warningArea.areaCodes.join(","),
        warningAreaName: warningArea.areaName,
        warningMunicipality: warningArea.municipality
      });
      applyWarningAreaToForm(warningArea);
    }

    async function updateWeatherAlerts() {
      const target = $("weatherAlerts");
      if (!target) return;

      if (warningAreaNeedsSync()) {
        target.innerHTML = `<span class="alert-pill">警報区域確認中</span>`;
        try {
          await syncSavedWarningArea();
        } catch {
          target.innerHTML = `<span class="alert-pill">警報区域設定不可</span>`;
          return;
        }
      }

      const officeCode = String(state.settings.warningOfficeCode || DEFAULTS.warningOfficeCode).trim();
      const areaCodes = String(state.settings.warningAreaCode || DEFAULTS.warningAreaCode)
        .split(/[\s,、]+/)
        .map((code) => code.trim())
        .filter(Boolean);
      if (!officeCode || !areaCodes.length) return;

      target.innerHTML = `<span class="alert-pill">警報確認中</span>`;
      try {
        const response = await fetch(`https://www.jma.go.jp/bosai/warning/data/r8/${officeCode}.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const records = Array.isArray(payload) ? payload : [payload];
        const activeWarnings = [];
        let reportDatetime = "";
        records.forEach((record) => {
          if (record.reportDatetime && (!reportDatetime || new Date(record.reportDatetime) > new Date(reportDatetime))) {
            reportDatetime = record.reportDatetime;
          }
          const items = [
            ...(record.warning?.class10Items || []),
            ...(record.warning?.class20Items || [])
          ];
          items
            .filter((item) => areaCodes.includes(String(item.areaCode)))
            .flatMap((item) => item.kinds || [])
            .filter((warning) => warning.code && warning.status !== "解除")
            .forEach((warning) => activeWarnings.push(toWarningDisplay(warning, record.dataTypeCode)));
        });
        const uniqueWarnings = activeWarnings.filter((warning, index, list) =>
          list.findIndex((candidate) => candidate.name === warning.name) === index
        );
        renderWeatherAlerts(uniqueWarnings, reportDatetime);
      } catch {
        target.innerHTML = `<span class="alert-pill">警報取得不可</span>`;
      }
    }

    function warningSignificanceLevel(warning) {
      const levels = (warning.properties || [])
        .flatMap((property) => property.significancyPart?.locals || [])
        .map((local) => Number.parseInt(String(local.code || "").charAt(0), 10))
        .filter((level) => level >= 2 && level <= 5);
      return levels.length ? Math.max(...levels) : 0;
    }

    function toWarningDisplay(warning, dataTypeCode) {
      const significanceLevel = warningSignificanceLevel(warning);
      const hazard = JMA_LEVEL_HAZARDS[dataTypeCode];
      const suffixes = { 2: "注意報", 3: "警報", 4: "危険警報", 5: "特別警報" };
      const name = hazard && significanceLevel
        ? `レベル${significanceLevel}${hazard}${suffixes[significanceLevel]}`
        : JMA_WARNING_NAMES[warning.code] || `警報・注意報 ${warning.code}`;
      return {
        code: warning.code,
        name,
        level: warningLevel(warning.code, significanceLevel)
      };
    }

    function renderWeatherAlerts(warnings, reportDatetime) {
      const target = $("weatherAlerts");
      if (!target) return;
      const areaName = state.settings.warningAreaName || DEFAULTS.warningAreaName;
      const reportTime = reportDatetime ? formatClock(reportDatetime) : "";
      target.title = reportTime ? `${areaName} ${reportTime}発表` : areaName;
      if (!warnings.length) {
        target.innerHTML = `<span class="alert-pill">発表なし</span>`;
        return;
      }
      target.innerHTML = warnings.slice(0, 4).map((warning) =>
        `<span class="alert-pill ${warning.level}">${escapeHtml(warning.name)}</span>`
      ).join("");
    }

    function warningLevel(code, significanceLevel = 0) {
      if (significanceLevel >= 5 || ["32", "33", "35", "36", "37", "38", "59"].includes(code)) return "special";
      if (significanceLevel >= 3 || ["02", "03", "04", "05", "06", "07", "08", "39", "49"].includes(code)) return "alarm";
      return "warn";
    }

    function formatClock(value) {
      if (!value) return "--:--";
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return "--:--";
      return new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
    }

    function getAstronomy(date, latitude, longitude) {
      const moonTimes = getMoonTimes(date, latitude, longitude);
      return {
        ...moonTimes,
        moonAge: getMoonAge(date)
      };
    }

    function getMoonAge(date) {
      const synodicMonth = 29.530588853;
      const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
      const days = (date.getTime() - knownNewMoon) / 86400000;
      return ((days % synodicMonth) + synodicMonth) % synodicMonth;
    }

    function renderMoonPhase(age) {
      const target = $("moonPhase");
      const visiblePercent = moonVisiblePercent(age);
      const label = `${visiblePercent}%`;
      const ageText = `月齢 ${age.toFixed(1)}日`;
      target.title = `月の可視率 ${label} / ${ageText}`;
      target.setAttribute("aria-label", `月の可視率 ${label}、${ageText}`);
      target.innerHTML = `${moonPhaseSvg(age)}<strong>${label}</strong>`;
    }

    function moonVisiblePercent(age) {
      const phase = age / 29.530588853;
      return Math.round((1 - Math.cos(2 * Math.PI * phase)) * 50);
    }

    function moonPhaseSvg(age) {
      const phase = age / 29.530588853;
      const radius = 26;
      const center = 32;
      const light = "#f4f7fb";
      const dark = "#111722";
      const rim = "#9ca8b8";
      const shadowPath = moonShadowPath(phase, center, radius);
      return `
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <defs>
            <clipPath id="moon-disc-clip"><circle cx="${center}" cy="${center}" r="${radius}"/></clipPath>
          </defs>
          <circle cx="${center}" cy="${center}" r="${radius}" fill="${light}"/>
          <path d="${shadowPath}" fill="${dark}" clip-path="url(#moon-disc-clip)"/>
          <circle cx="${center}" cy="${center}" r="${radius}" fill="none" stroke="${rim}" stroke-width="2" opacity=".74"/>
        </svg>
      `;
    }

    function moonShadowPath(phase, center, radius) {
      const normalized = ((phase % 1) + 1) % 1;
      const epsilon = .015;
      const top = center - radius;
      const bottom = center + radius;
      if (normalized < epsilon || normalized > 1 - epsilon) {
        return `M ${center} ${top} A ${radius} ${radius} 0 1 1 ${center} ${bottom} A ${radius} ${radius} 0 1 1 ${center} ${top} Z`;
      }
      if (Math.abs(normalized - .5) < epsilon) {
        return "";
      }

      const curveRadius = Math.max(.01, radius * Math.abs(Math.cos(2 * Math.PI * normalized)));
      if (normalized < .25) {
        return `M ${center} ${top} A ${radius} ${radius} 0 0 0 ${center} ${bottom} A ${curveRadius} ${radius} 0 0 1 ${center} ${top} Z`;
      }
      if (normalized < .5) {
        return `M ${center} ${top} A ${radius} ${radius} 0 0 0 ${center} ${bottom} A ${curveRadius} ${radius} 0 0 0 ${center} ${top} Z`;
      }
      if (normalized < .75) {
        return `M ${center} ${top} A ${radius} ${radius} 0 0 1 ${center} ${bottom} A ${curveRadius} ${radius} 0 0 0 ${center} ${top} Z`;
      }
      return `M ${center} ${top} A ${radius} ${radius} 0 0 1 ${center} ${bottom} A ${curveRadius} ${radius} 0 0 1 ${center} ${top} Z`;
    }

    function getMoonTimes(date, latitude, longitude) {
      const start = new Date(date);
      start.setHours(0, 0, 0, 0);
      const times = [];
      for (let hour = 0; hour <= 24; hour += 1) {
        const sample = new Date(start.getTime() + hour * 3600000);
        times.push({ date: sample, altitude: moonAltitude(sample, latitude, longitude) });
      }

      const horizon = 0.125 * Math.PI / 180;
      let moonrise = null;
      let moonset = null;
      for (let i = 1; i < times.length; i += 1) {
        const previous = times[i - 1].altitude - horizon;
        const current = times[i].altitude - horizon;
        if (previous === 0 || current === 0 || previous * current <= 0) {
          const fraction = Math.abs(previous) / (Math.abs(previous) + Math.abs(current));
          const eventTime = new Date(times[i - 1].date.getTime() + fraction * 3600000);
          if (previous < current && !moonrise) moonrise = eventTime;
          if (previous > current && !moonset) moonset = eventTime;
        }
      }
      return { moonrise, moonset };
    }

    function moonAltitude(date, latitude, longitude) {
      const rad = Math.PI / 180;
      const day = dateToJulianDays(date);
      const eclipticLongitude = rad * (218.316 + 13.176396 * day);
      const meanAnomaly = rad * (134.963 + 13.064993 * day);
      const distanceArgument = rad * (93.272 + 13.229350 * day);
      const longitudeMoon = eclipticLongitude + rad * 6.289 * Math.sin(meanAnomaly);
      const latitudeMoon = rad * 5.128 * Math.sin(distanceArgument);
      const obliquity = rad * 23.4397;
      const rightAscension = Math.atan2(
        Math.sin(longitudeMoon) * Math.cos(obliquity) - Math.tan(latitudeMoon) * Math.sin(obliquity),
        Math.cos(longitudeMoon)
      );
      const declination = Math.asin(
        Math.sin(latitudeMoon) * Math.cos(obliquity) + Math.cos(latitudeMoon) * Math.sin(obliquity) * Math.sin(longitudeMoon)
      );
      const siderealTime = rad * (280.16 + 360.9856235 * day) + longitude * rad;
      const hourAngle = siderealTime - rightAscension;
      const lat = latitude * rad;
      return Math.asin(Math.sin(lat) * Math.sin(declination) + Math.cos(lat) * Math.cos(declination) * Math.cos(hourAngle));
    }

    function dateToJulianDays(date) {
      return date.getTime() / 86400000 - 10957.5;
    }

    function proxyStrategies() {
      const selected = state.settings.proxy || "auto";
      const strategies = {
        direct: (feed) => ({ kind: "xml", name: "直接取得", url: feed }),
        allorigins: (feed) => ({ kind: "xml", name: "AllOrigins", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(feed)}` }),
        rss2json: (feed) => ({ kind: "json", name: "rss2json", url: `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}` }),
        jina: (feed) => ({ kind: "markdown", name: "Jina Reader", url: `https://r.jina.ai/http://r.jina.ai/http://${feed}` })
      };
      if (selected === "auto") return [strategies.allorigins, strategies.rss2json, strategies.jina, strategies.direct];
      const picked = strategies[selected] || strategies.allorigins;
      return [picked, ...[strategies.allorigins, strategies.rss2json, strategies.jina, strategies.direct].filter((strategy) => strategy !== picked)];
    }

    async function readFeed(feed) {
      const errors = [];
      for (const buildStrategy of proxyStrategies()) {
        const strategy = buildStrategy(feed);
        try {
          const response = await fetch(strategy.url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (strategy.kind === "json") {
            const json = await response.json();
            if (json.status && json.status !== "ok") throw new Error(json.message || json.status);
            const items = (json.items || []).map((item) => ({
              title: item.title,
              link: item.link,
              source: json.feed?.title || new URL(feed).hostname,
              date: item.pubDate || item.published
            }));
            if (items.length) return items;
            throw new Error("記事なし");
          }
          const text = await response.text();
          if (strategy.kind === "markdown") {
            const items = parseMarkdownFeed(text, feed);
            if (items.length) return items;
            throw new Error("記事なし");
          }
          const doc = new DOMParser().parseFromString(text, "text/xml");
          if (doc.querySelector("parsererror")) throw new Error("XML解析エラー");
          const items = [...doc.querySelectorAll("item, entry")].map((item) => ({
            title: textOf(item, "title"),
            link: textOf(item, "link") || item.querySelector("link")?.getAttribute("href") || feed,
            source: textOf(doc, "channel > title") || textOf(doc, "feed > title") || new URL(feed).hostname,
            date: textOf(item, "pubDate") || textOf(item, "updated") || textOf(item, "published")
          }));
          if (items.length) return items;
          throw new Error("記事なし");
        } catch (error) {
          errors.push(`${strategy.name}: ${error.message}`);
        }
      }
      throw new Error(errors.join(" / "));
    }

    function parseMarkdownFeed(text, feed) {
      const source = text.match(/^Title:\s*(.+)$/m)?.[1]?.trim() || new URL(feed).hostname;
      const items = [];
      const itemPattern = /^### \[([^\]]+)\]\(([^)]+)\)\s*\n+\[[^\]]+\]\([^)]+\)\s*\n+([^\n]+)/gm;
      let match;
      while ((match = itemPattern.exec(text)) !== null) {
        items.push({
          title: match[1].trim(),
          link: match[2].trim(),
          source,
          date: match[3].trim()
        });
      }
      return items;
    }

    function textOf(root, selector) {
      return root.querySelector(selector)?.textContent?.trim() || "";
    }

    function formatNewsDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(date);
    }

    async function updateNews() {
      $("newsStatus").textContent = "更新中";
      try {
        const settled = await Promise.allSettled(state.settings.feeds.filter(Boolean).map(readFeed));
        const items = settled.flatMap((result) => result.status === "fulfilled" ? result.value : []);
        const failures = settled.filter((result) => result.status === "rejected").length;
        state.news = items
          .filter((item) => item.title)
          .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))
          .slice(0, 24);
        renderNews();
        $("newsStatus").textContent = state.news.length
          ? `${state.news.length}件 更新 ${new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit" }).format(new Date())}`
          : failures
            ? "RSSを取得できません"
            : "記事がありません";
      } catch {
        $("newsStatus").innerHTML = `<span class="error">RSSを取得できません</span>`;
      }
    }

    function renderNews() {
      const items = state.news.length ? state.news : [{ title: "RSSニュースを待機しています", source: "Signage", date: "" }];
      const markup = items.map(renderNewsItem).join("");
      $("newsItems").innerHTML = `<div class="news-sequence">${markup}</div><div class="news-sequence" aria-hidden="true">${markup}</div>`;
      const bottomTicker = $("bottomTicker");
      if (bottomTicker) bottomTicker.textContent = items.map((item) => item.title).join("  /  ");
      state.newsOffset = 0;
      $("newsItems").style.transform = "translateX(0)";
    }

    function renderNewsItem(item) {
      return `
        <article class="news-item">
          <span class="bullet"></span>
          <div>
            <h3 class="headline">${escapeHtml(item.title)}</h3>
            <div class="meta"><span>${escapeHtml(item.source || "")}</span><span>${escapeHtml(formatNewsDate(item.date))}</span></div>
          </div>
        </article>
      `;
    }

    function scrollNews() {
      const wrap = document.querySelector(".ticker-wrap");
      const list = $("newsItems");
      const firstSequence = list?.querySelector(".news-sequence");
      if (!wrap || !list || !firstSequence || firstSequence.scrollWidth <= wrap.clientWidth) {
        list.style.transform = "translateX(0)";
        return;
      }
      const gap = Number.parseFloat(getComputedStyle(list).getPropertyValue("--news-gap")) || 0;
      const loopDistance = firstSequence.scrollWidth + gap;
      state.newsOffset = (state.newsOffset + .55) % loopDistance;
      list.style.transform = `translateX(${-state.newsOffset}px)`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function resetTimers() {
      state.timers.forEach(clearInterval);
      state.timers = [
        setInterval(updateClock, 1000),
        setInterval(updateWeather, Math.max(1, Number(state.settings.weatherMinutes)) * 60000),
        setInterval(updateWeatherAlerts, Math.max(1, Number(state.settings.alertMinutes || DEFAULTS.alertMinutes)) * 60000),
        setInterval(updateNews, Math.max(1, Number(state.settings.newsMinutes)) * 60000),
        setInterval(scrollNews, 40)
      ];
    }

    const REMOTE_KEY_CODES = {
      4: "Back",
      13: "Enter",
      19: "ArrowUp",
      20: "ArrowDown",
      21: "ArrowLeft",
      22: "ArrowRight",
      23: "Enter",
      37: "ArrowLeft",
      38: "ArrowUp",
      39: "ArrowRight",
      40: "ArrowDown"
    };

    function remoteKey(event) {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Escape", "BrowserBack", "GoBack"].includes(event.key)) {
        return event.key;
      }
      return REMOTE_KEY_CODES[event.keyCode || event.which] || "";
    }

    function focusRemoteElement(element) {
      if (!element) return;
      try {
        element.focus({ preventScroll: true });
      } catch {
        element.focus();
      }
      try {
        element.scrollIntoView({ block: "nearest", inline: "nearest" });
      } catch {
        element.scrollIntoView(false);
      }
    }

    function remoteFocusableElements() {
      if (!$("settings").classList.contains("open")) return [$("openSettings")];
      const scope = $("settings");
      return Array.from(scope.querySelectorAll("button, input, textarea, select, [tabindex]"))
        .filter((element) => {
          if (element.disabled || element.tabIndex < 0) return false;
          const style = getComputedStyle(element);
          const rect = element.getBoundingClientRect();
          return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
        });
    }

    function moveRemoteFocus(direction) {
      const elements = remoteFocusableElements();
      if (!elements.length) return;
      const current = elements.includes(document.activeElement) ? document.activeElement : null;
      if (!current) {
        focusRemoteElement($("settings").classList.contains("open") ? $("settingMunicipality") : $("openSettings"));
        return;
      }

      const currentRect = current.getBoundingClientRect();
      const currentCenter = {
        x: currentRect.left + currentRect.width / 2,
        y: currentRect.top + currentRect.height / 2
      };
      const vertical = direction === "ArrowUp" || direction === "ArrowDown";
      const sign = direction === "ArrowDown" || direction === "ArrowRight" ? 1 : -1;
      const candidates = elements
        .filter((element) => element !== current)
        .map((element) => {
          const rect = element.getBoundingClientRect();
          const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          const primary = ((vertical ? center.y : center.x) - (vertical ? currentCenter.y : currentCenter.x)) * sign;
          const secondary = Math.abs((vertical ? center.x : center.y) - (vertical ? currentCenter.x : currentCenter.y));
          const overlaps = vertical
            ? rect.right >= currentRect.left && rect.left <= currentRect.right
            : rect.bottom >= currentRect.top && rect.top <= currentRect.bottom;
          return { element, primary, score: primary * 2 + secondary + (overlaps ? 0 : 10000) };
        })
        .filter((candidate) => candidate.primary > 4)
        .sort((a, b) => a.score - b.score);

      if (candidates[0]) {
        focusRemoteElement(candidates[0].element);
        return;
      }
      const index = elements.indexOf(current);
      const step = sign > 0 ? 1 : -1;
      focusRemoteElement(elements[(index + step + elements.length) % elements.length]);
    }

    function openSettingsDrawer() {
      $("settings").classList.add("open");
      setTimeout(() => focusRemoteElement($("settingMunicipality")), 240);
    }

    function closeSettingsDrawer() {
      $("settings").classList.remove("open");
      setTimeout(() => focusRemoteElement($("openSettings")), 240);
    }

    function handleRemoteNavigation(event) {
      const key = remoteKey(event);
      if (!key) return;
      document.body.classList.add("remote-navigation");
      const drawerOpen = $("settings").classList.contains("open");

      if (["Escape", "BrowserBack", "GoBack", "Back"].includes(key) && drawerOpen) {
        event.preventDefault();
        event.stopPropagation();
        closeSettingsDrawer();
        return;
      }

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
        if (document.activeElement instanceof HTMLSelectElement && document.activeElement.dataset.remoteOpen === "true") return;
        event.preventDefault();
        event.stopPropagation();
        moveRemoteFocus(key);
        return;
      }

      if (key === "Enter" && !remoteFocusableElements().includes(document.activeElement)) {
        event.preventDefault();
        event.stopPropagation();
        focusRemoteElement(drawerOpen ? $("settingMunicipality") : $("openSettings"));
        if (!drawerOpen) openSettingsDrawer();
        return;
      }

      if (key === "Enter" && document.activeElement instanceof HTMLSelectElement) {
        document.activeElement.dataset.remoteOpen = "true";
      }

      if (key === "Enter" && (event.keyCode === 23 || event.which === 23) && document.activeElement instanceof HTMLButtonElement) {
        event.preventDefault();
        document.activeElement.click();
      }
    }

    function boot() {
      applyChrome();
      updateClock();
      updateWeather();
      updateWeatherAlerts();
      updateNews();
      resetTimers();
      document.addEventListener("keydown", handleRemoteNavigation, true);
      $("openSettings").addEventListener("click", openSettingsDrawer);
      $("closeSettings").addEventListener("click", closeSettingsDrawer);
      $("settingMunicipality").addEventListener("input", (event) => {
        event.currentTarget.dataset.resolved = "";
        setMunicipalityStatus("");
      });
      ["settingWarningOffice", "settingWarningArea", "settingWarningName"].forEach((id) => {
        $(id).addEventListener("input", () => {
          $("settingWarningArea").dataset.municipality = "";
        });
      });
      $("resolveMunicipality").addEventListener("click", () => {
        resolveMunicipalityFromForm().catch(() => {});
      });
      $("resetSettings").addEventListener("click", () => {
        saveSettings({ ...DEFAULTS });
        applyChrome();
        updateWeather();
        updateWeatherAlerts();
        updateNews();
        resetTimers();
      });
      $("settingsForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const municipalityInput = $("settingMunicipality");
        const municipality = normalizeLocationName(municipalityInput.value);
        if (municipality && municipalityInput.dataset.resolved !== municipality) {
          try {
            await resolveMunicipalityFromForm();
          } catch {
            return;
          }
        }
        saveSettings(readSettingsForm());
        applyChrome();
        updateWeather();
        updateWeatherAlerts();
        updateNews();
        resetTimers();
        closeSettingsDrawer();
      });
      $("settingProxy").addEventListener("change", () => {
        $("settingProxy").dataset.remoteOpen = "";
        saveSettings(readSettingsForm());
        updateNews();
        resetTimers();
      });
      $("settingProxy").addEventListener("blur", () => {
        $("settingProxy").dataset.remoteOpen = "";
      });
    }

    function readSettingsForm() {
      return {
          place: $("settingPlace").value.trim() || DEFAULTS.place,
          municipality: $("settingMunicipality").value.trim(),
          latitude: Number($("settingLat").value) || DEFAULTS.latitude,
          longitude: Number($("settingLon").value) || DEFAULTS.longitude,
          warningOfficeCode: $("settingWarningOffice").value.trim() || DEFAULTS.warningOfficeCode,
          warningAreaCode: $("settingWarningArea").value.trim() || DEFAULTS.warningAreaCode,
          warningAreaName: $("settingWarningName").value.trim() || DEFAULTS.warningAreaName,
          warningMunicipality: $("settingWarningArea").dataset.municipality || "",
          weatherMinutes: Math.max(1, Number($("settingWeatherMinutes").value) || DEFAULTS.weatherMinutes),
          alertMinutes: Math.max(1, Number($("settingAlertMinutes").value) || DEFAULTS.alertMinutes),
          newsMinutes: Math.max(1, Number($("settingNewsMinutes").value) || DEFAULTS.newsMinutes),
          proxy: $("settingProxy").value,
          feeds: $("settingFeeds").value.split("\n").map((line) => line.trim()).filter(Boolean)
        };
    }

    boot();
  </script>
</body>
